services:
  postgres:
    image: postgres:16-alpine
    container_name: returns-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: returns
      POSTGRES_PASSWORD: returns
      POSTGRES_DB: returns
    ports:
      - "5433:5432"
    volumes:
      - returns-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returns -d returns"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  returns-pgdata:
