# Render blueprint for the API and its database.
#
# The client is NOT here — it deploys to Vercel as a static SPA (see
# vercel.json). Only the Express API and Postgres live on Render.
#
# Create both by pointing Render at this repo: New → Blueprint.

databases:
  - name: returns-manager-db
    # Free Postgres is deleted after 30 days — move to a paid plan before you
    # have real merchant data in it.
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: returns-manager-api
    runtime: node
    plan: free
    rootDir: .

    # `--include=dev` matters: the Prisma CLI and tsc are devDependencies, and
    # both are needed to build. Render sets NODE_ENV=production, which would
    # otherwise skip them.
    buildCommand: npm install --include=dev && npm run build --workspace server

    # Migrations run between build and traffic switch, so a failed migration
    # never takes the running version down with it.
    # NOTE: preDeployCommand needs a paid instance. On free, append
    #   && npm run db:deploy --workspace server
    # to buildCommand instead.
    preDeployCommand: npm run db:deploy --workspace server

    startCommand: npm run start --workspace server

    # Hits the database, so a service that can't reach Postgres fails the check
    # rather than serving 500s.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: returns-manager-db
          property: connectionString

      # Signs admin and portal sessions. Rotating it logs everyone out.
      - key: JWT_SECRET
        generateValue: true

      # ---------------------------------------------------------------------
      # sync: false means "prompt me in the dashboard" — Render never puts
      # these in the repo, and neither should you.
      # ---------------------------------------------------------------------

      # Must be exactly 64 hex characters: openssl rand -hex 32
      # generateValue can't produce that shape, so it's entered by hand.
      # Encrypts Shopify access tokens at rest — once a store is connected,
      # changing this makes every stored token undecryptable.
      - key: ENCRYPTION_KEY
        sync: false

      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false

      # This service's own public URL, e.g. https://returns-manager-api.onrender.com
      # Shopify redirects OAuth here and posts webhooks here, so it must match
      # the Partner Dashboard exactly.
      - key: APP_URL
        sync: false

      # The Vercel origin, comma-separated if you have several (preview URLs).
      # Also the default base for links in customer emails.
      - key: CORS_ORIGINS
        sync: false
      - key: PORTAL_BASE_URL
        sync: false

      - key: SHOPIFY_SCOPES
        value: read_orders,read_fulfillments,read_products,read_customers,write_customers,read_returns,write_returns,read_locations,read_store_credit_accounts,read_store_credit_account_transactions,write_store_credit_account_transactions,read_gift_cards,write_gift_cards,read_draft_orders,write_draft_orders
      - key: SHOPIFY_API_VERSION
        value: "2026-04"

      # Resend (or any SMTP). Without these, emails are written to disk and
      # never sent — fine for a first deploy, not for real customers.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
