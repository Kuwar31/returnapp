# Shopify app configuration for returns-manager.
#
# This app is NOT a Shopify-CLI-hosted app — the merchant dashboard is a
# standalone site (like Loop's), and Shopify is only a data source reached over
# OAuth, webhooks and the Admin API. So `embedded` is false and there are no
# extensions here; this file exists purely to declare URLs and scopes.
#
# Push changes with:  shopify app deploy
# The two URLs below must share the same host, or OAuth fails with
# "redirect_uri and application url must have matching hosts".

client_id = "58b2e040993df7541988cdbca72bf38c"
name = "returns-manager"

# Must stay above the first [table] header. TOML assigns every key to the
# table it follows, so placing this lower makes it access_scopes.application_url
# and the CLI reports "Valid URL is required" for the top-level key it can't find.
application_url = "https://returnapp-yxkl.onrender.com"

# False because the admin renders on its own domain with its own login, not
# inside an iframe in the Shopify admin.
embedded = false

[access_scopes]
# Orders/products/customers are read-only — the app mirrors them, never edits.
# Four write scopes, one per way a return can be settled:
#   write_returns                            creates the Return and issues refunds
#   write_store_credit_account_transactions  credits the customer's store credit
#   write_gift_cards                         issues a gift card
#   write_draft_orders                       opens the exchange's draft order,
#                                            reserves its stock and invoices it
#
# The *_fulfillment_orders scopes hold a paid exchange until the return is
# approved. A shopper can pay for an upsell the instant they submit, which
# otherwise drops a ready-to-ship order into the merchant's queue for a return
# nobody has reviewed yet. Both the merchant-managed and third-party pairs are
# requested because a replacement ships from wherever that product lives —
# covering only own-warehouse stock would work on some stores and silently not
# on others.
#
# Add read_all_orders to reach orders older than 60 days (needs Shopify approval).
scopes = "read_orders,read_fulfillments,read_products,read_customers,write_customers,read_returns,write_returns,read_locations,read_store_credit_accounts,read_store_credit_account_transactions,write_store_credit_account_transactions,read_gift_cards,write_gift_cards,read_draft_orders,write_draft_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_third_party_fulfillment_orders,write_third_party_fulfillment_orders"

# The storefront app proxy.
#
# Shopify forwards https://<shop>.myshopify.com/apps/returns to the URL below
# and renders the reply inside the merchant's own theme when it comes back as
# application/liquid. That is how the portal appears on the store's own domain,
# wrapped in their header and footer, with no DNS, no certificate and no
# subdomain to arrange — the same mechanism Loop uses.
#
# Requests are signed; see verifyProxySignature. Without that check this URL
# would let anyone ask the server to render any store's portal.
[app_proxy]
url = "https://returnapp-yxkl.onrender.com/api/proxy"
subpath = "returns"
prefix = "apps"

[auth]
redirect_urls = [
  "https://returnapp-yxkl.onrender.com/api/shopify/callback"
]

[webhooks]
# Order and fulfillment subscriptions are registered at runtime by the app
# itself (see server/src/modules/shopify/shopify.install.ts), so only the
# version is declared here.
api_version = "2026-04"
